[package]
name = "whatsapp-rust-sqlite-storage"
version = "0.7.0"
edition = "2024"
rust-version.workspace = true
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
repository = "https://github.com/oxidezap/whatsapp-rust"
description = "SQLite storage backend for whatsapp-rust"

# `libsqlite3-sys` is pulled only to activate its `bundled` feature (compile
# SQLite in-tree); there is no direct `use`, so static analysers flag it.
[package.metadata.cargo-machete]
# Diesel uses sqlite-wasm-rs; the direct edge constrains its WASM host ABI.
ignored = ["libsqlite3-sys", "sqlite-wasm-rs"]

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["libsqlite3-sys/bundled"]
test-util = []
wasm-test = ["wacore/js"]

[dependencies]
async-trait = { workspace = true }
buffa = { workspace = true }
bytes = { workspace = true }
diesel = { workspace = true }
diesel_migrations = { workspace = true }
log = { workspace = true }
# Shared across all r2d2 pools so each per-session store doesn't spawn its own pool of
# management threads. Already in the tree transitively via r2d2 0.8.
# 0.2.8 requires parking_lot 0.13 and Rust 1.95. Keep published MSRV 1.94.
scheduled-thread-pool = ">=0.2.7, <0.2.9"
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
thiserror = { workspace = true }
wacore = { workspace = true }
wacore-binary = { workspace = true }

# Diesel uses sqlite-wasm-rs on browser/Node WASM. This helper only enables
# native SQLite bundling; use Diesel's complementary target condition so it
# cannot pull a native C build into the WebAssembly dependency graph.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
libsqlite3-sys = { version = "0.38", default-features = false, optional = true }

[build-dependencies]
buffa-build = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
waproto = { workspace = true }
portable-atomic = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# Tokio's timer requires a runtime time driver, which the single-agent browser
# target does not provide. This future wraps the platform's real setTimeout.
gloo-timers = { version = "0.4", features = ["futures"] }

# The browser/Node consumer needs the JavaScript host functions. Version 0.6
# exposes them only through this explicit feature, including fresh packages.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "0.6.2", default-features = false, features = ["wasm-bindgen"] }

[[bench]]
name = "signal_flush"
harness = false

[[bench]]
name = "store_shapes"
harness = false

[[bench]]
name = "store_contention"
harness = false

[[bench]]
name = "signal_cache_contention"
harness = false

[lints]
workspace = true
